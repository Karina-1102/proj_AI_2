<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Авторизация и Личный кабинет</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app-container">
    <section id="login-screen" class="card screen active" aria-labelledby="login-heading">
      <header class="card-header">
        <h1 id="login-heading" class="card-title">Вход в систему</h1>
        <p class="card-subtitle">Введите ваши учетные данные для продолжения</p>
      </header>

      <form id="login-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="login-email" class="form-label">Email</label>
          <input
            type="email"
            id="login-email"
            name="email"
            class="form-input"
            placeholder="name@example.com"
            autocomplete="email"
            required
          >
          <span class="error-message" id="login-email-error" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="login-password" class="form-label">Пароль</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="login-password"
              name="password"
              class="form-input"
              placeholder="Введите пароль"
              autocomplete="current-password"
              required
            >
            <button
              type="button"
              class="toggle-password"
              data-target="login-password"
              aria-label="Показать или скрыть пароль"
            >
              <svg class="eye-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <span class="error-message" id="login-password-error" aria-live="polite"></span>
        </div>

        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" id="remember-me" name="rememberMe" class="checkbox-input">
            <span>Запомнить меня</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary">Войти</button>
      </form>

      <footer class="card-footer">
        <p>Еще нет аккаунта? <button type="button" class="link-btn" data-navigate="register">Зарегистрироваться</button></p>
      </footer>
    </section>

    <section id="register-screen" class="card screen" aria-labelledby="register-heading" hidden>
      <header class="card-header">
        <h1 id="register-heading" class="card-title">Регистрация</h1>
        <p class="card-subtitle">Создайте новый аккаунт за минуту</p>
      </header>

      <form id="register-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="register-name" class="form-label">Имя</label>
          <input
            type="text"
            id="register-name"
            name="name"
            class="form-input"
            placeholder="Иван Иванов"
            autocomplete="name"
            required
          >
          <span class="error-message" id="register-name-error" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="register-email" class="form-label">Email</label>
          <input
            type="email"
            id="register-email"
            name="email"
            class="form-input"
            placeholder="name@example.com"
            autocomplete="email"
            required
          >
          <span class="error-message" id="register-email-error" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="register-password" class="form-label">Пароль</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="register-password"
              name="password"
              class="form-input"
              placeholder="Минимум 6 символов"
              autocomplete="new-password"
              required
            >
            <button
              type="button"
              class="toggle-password"
              data-target="register-password"
              aria-label="Показать или скрыть пароль"
            >
              <svg class="eye-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <span class="error-message" id="register-password-error" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="register-confirm-password" class="form-label">Подтверждение пароля</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="register-confirm-password"
              name="confirmPassword"
              class="form-input"
              placeholder="Повторите пароль"
              autocomplete="new-password"
              required
            >
            <button
              type="button"
              class="toggle-password"
              data-target="register-confirm-password"
              aria-label="Показать или скрыть пароль"
            >
              <svg class="eye-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <span class="error-message" id="register-confirm-password-error" aria-live="polite"></span>
        </div>

        <button type="submit" class="btn btn-primary">Создать аккаунт</button>
      </form>

      <footer class="card-footer">
        <p>Уже есть аккаунт? <button type="button" class="link-btn" data-navigate="login">Войти</button></p>
      </footer>
    </section>

    <section id="dashboard-screen" class="card screen" aria-labelledby="dashboard-heading" hidden>
      <header class="card-header dashboard-header">
        <div class="avatar-circle" id="user-avatar" aria-hidden="true">U</div>
        <h1 id="dashboard-heading" class="card-title">Личный кабинет</h1>
        <p class="card-subtitle">Вы успешно авторизованы в системе</p>
      </header>

      <div class="user-profile">
        <div class="profile-row">
          <span class="profile-label">Имя пользователя</span>
          <span class="profile-value" id="dashboard-name"></span>
        </div>
        <div class="profile-row">
          <span class="profile-label">Электронная почта</span>
          <span class="profile-value" id="dashboard-email"></span>
        </div>
        <div class="profile-row">
          <span class="profile-label">Тип сессии</span>
          <span class="profile-badge" id="dashboard-session-type"></span>
        </div>
      </div>

      <button type="button" id="logout-btn" class="btn btn-danger">Выйти из аккаунта</button>
    </section>
  </main>
</body>
</html>
